<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORENSIC AUDIT | Sovereign Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
    <style>
        body { background: #030303; color: #fff; font-family: 'Courier New', Courier, monospace; }
        .data-box { background: #0a0a0a; border-left: 4px solid #3b82f6; }
        .red-alert { border-left: 4px solid #ef4444; color: #ef4444; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-3xl mx-auto space-y-8">
        <header class="border-b border-zinc-800 pb-6 text-center">
            <h1 class="text-xs font-bold text-zinc-500 tracking-[0.5em] uppercase mb-2">Internal Use Only</h1>
            <h2 class="text-2xl font-black italic">FORENSIC <span class="text-blue-500">EXTRACTOR</span></h2>
        </header>

        <!-- INPUT -->
        <div class="border-2 border-dashed border-zinc-800 p-12 text-center rounded-3xl hover:border-blue-500 transition-all">
            <input type="file" id="fileIn" class="hidden" onchange="hunt(this)">
            <label for="fileIn" class="cursor-pointer">
                <p class="text-xs font-bold uppercase tracking-widest">Select Target File</p>
            </label>
        </div>

        <!-- RESULTS -->
        <div id="results" class="hidden space-y-4">
            <div id="statusBox" class="p-6 data-box rounded-xl">
                <h3 class="text-[10px] font-black uppercase mb-4">Target Intelligence Report</h3>
                
                <div class="space-y-3 text-xs">
                    <p>DEVICE: <span id="device" class="text-white font-bold">...</span></p>
                    <p>SOFTWARE: <span id="software" class="text-white font-bold">...</span></p>
                    <p>DATE/TIME: <span id="timestamp" class="text-white font-bold">...</span></p>
                    <div id="gpsContainer" class="hidden pt-4 border-t border-zinc-900">
                        <p class="text-red-500 font-bold mb-2 underline uppercase">GEOLOCATION EXPOSED:</p>
                        <p>LAT: <span id="lat" class="text-white"></span></p>
                        <p>LON: <span id="lon" class="text-white"></span></p>
                        <a id="mapLink" target="_blank" class="inline-block mt-4 bg-red-600 text-white px-4 py-2 rounded text-[10px] font-black uppercase">View Exact Location on Google Maps</a>
                    </div>
                </div>
            </div>
            
            <p class="text-[9px] text-zinc-600 italic uppercase">This data was extracted locally. Zero footprint left on network.</p>
        </div>
    </div>

    <script>
        function hunt(input) {
            const file = input.files[0];
            if (!file) return;

            document.getElementById('results').classList.remove('hidden');

            EXIF.getData(file, function() {
                // Basic Info
                document.getElementById('device').innerText = EXIF.getTag(this, "Make") + " " + EXIF.getTag(this, "Model") || "HIDDEN";
                document.getElementById('software').innerText = EXIF.getTag(this, "Software") || "NONE";
                document.getElementById('timestamp').innerText = EXIF.getTag(this, "DateTime") || "NOT FOUND";

                // GPS Extraction
                const latData = EXIF.getTag(this, "GPSLatitude");
                const lonData = EXIF.getTag(this, "GPSLongitude");
                const latRef = EXIF.getTag(this, "GPSLatitudeRef") || "N";
                const lonRef = EXIF.getTag(this, "GPSLongitudeRef") || "W";

                if (latData && lonData) {
                    const lat = convertToDecimal(latData, latRef);
                    const lon = convertToDecimal(lonData, lonRef);

                    document.getElementById('gpsContainer').classList.remove('hidden');
                    document.getElementById('statusBox').classList.add('red-alert');
                    document.getElementById('lat').innerText = lat.toFixed(6);
                    document.getElementById('lon').innerText = lon.toFixed(6);
                    document.getElementById('mapLink').href = `https://www.google.com/maps?q=${lat},${lon}`;
                } else {
                    document.getElementById('gpsContainer').classList.add('hidden');
                    document.getElementById('statusBox').classList.remove('red-alert');
                }
            });
        }

        function convertToDecimal(coords, ref) {
            let decimal = coords[0] + (coords[1] / 60) + (coords[2] / 3600);
            if (ref === "S" || ref === "W") decimal = decimal * -1;
            return decimal;
        }
    </script>
</body>
</html>
