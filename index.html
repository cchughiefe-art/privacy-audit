<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN | Forensic Audit Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #eee; font-family: 'JetBrains Mono', monospace; }
        .audit-card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 20px; transition: 0.3s; }
        .audit-card:hover { border-color: #3b82f6; }
        .danger-zone { border-color: #ef4444 !important; box-shadow: 0 0 20px rgba(239, 68, 68, 0.1); }
        .glitch-text { text-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="mb-12 border-b border-zinc-900 pb-8 flex justify-between items-end">
            <div>
                <h1 class="text-[10px] text-zinc-600 uppercase tracking-[0.5em] mb-2">Digital Forensic Unit</h1>
                <h2 class="text-3xl font-black italic uppercase text-blue-500 glitch-text">Audit <span class="text-white">Suite</span></h2>
            </div>
            <div class="text-right hidden md:block">
                <p class="text-[8px] text-zinc-800 uppercase font-bold">Encrypted / Local-Only</p>
            </div>
        </header>

        <div class="grid grid-cols-1 gap-8">
            <!-- UPLOAD SECTION -->
            <div class="audit-card p-12 text-center border-dashed border-2 border-zinc-800">
                <input type="file" id="fileIn" class="hidden" onchange="performAudit(this)">
                <label for="fileIn" class="cursor-pointer group">
                    <p class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4 group-hover:text-blue-500">Target File for Extraction</p>
                    <div class="w-16 h-16 bg-zinc-900 rounded-full flex items-center justify-center mx-auto mb-4 border border-zinc-800 group-hover:border-blue-500">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </div>
                </label>
            </div>

            <!-- RESULTS SECTION -->
            <div id="results" class="hidden space-y-6">
                <div id="statusCard" class="audit-card p-8 space-y-6">
                    <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest border-b border-zinc-900 pb-4 italic">Forensic Report</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-[10px] font-bold uppercase">
                        <div class="p-4 bg-black rounded-lg">
                            <p class="text-zinc-600 mb-1">Hardware Signature</p>
                            <p id="resDevice" class="text-white">---</p>
                        </div>
                        <div class="p-4 bg-black rounded-lg">
                            <p class="text-zinc-600 mb-1">Software Trail</p>
                            <p id="resSoftware" class="text-white">---</p>
                        </div>
                        <div class="p-4 bg-black rounded-lg">
                            <p class="text-zinc-600 mb-1">Capture Timestamp</p>
                            <p id="resTime" class="text-white">---</p>
                        </div>
                        <div id="gpsAlert" class="p-4 bg-black rounded-lg">
                            <p class="text-zinc-600 mb-1">GPS Status</p>
                            <p id="resGPSStatus" class="text-white italic">Searching...</p>
                        </div>
                    </div>

                    <!-- GEOLOCATION BOX -->
                    <div id="gpsData" class="hidden p-8 border border-red-900/50 bg-red-950/10 rounded-2xl space-y-4">
                        <p class="text-red-500 text-xs font-black uppercase underline">Security Vulnerability: GPS Coordinates Found</p>
                        <div class="grid grid-cols-2 gap-4 text-xs font-bold">
                            <p>LAT: <span id="latVal" class="text-white">0.00</span></p>
                            <p>LON: <span id="lonVal" class="text-white">0.00</span></p>
                        </div>
                        <a id="mapLink" target="_blank" class="block w-full py-4 bg-red-600 hover:bg-white hover:text-black text-white text-center rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">Show Location on Google Maps</a>
                    </div>
                </div>

                <div class="text-center">
                    <button onclick="location.reload()" class="text-[8px] text-zinc-800 uppercase underline font-bold">Wipe Cache & Re-Scan</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function performAudit(input) {
            const file = input.files[0];
            if (!file) return;

            document.getElementById('results').classList.remove('hidden');
            const gpsBox = document.getElementById('gpsData');
            const statusCard = document.getElementById('statusCard');

            EXIF.getData(file, function() {
                // Device Info
                const make = EXIF.getTag(this, "Make") || "";
                const model = EXIF.getTag(this, "Model") || "";
                document.getElementById('resDevice').innerText = (make + " " + model).trim() || "ANONYMOUS";
                
                document.getElementById('resSoftware').innerText = EXIF.getTag(this, "Software") || "RAW IMAGE";
                document.getElementById('resTime').innerText = EXIF.getTag(this, "DateTime") || "NOT TIMESTAMPED";

                // GPS Data
                const lat = EXIF.getTag(this, "GPSLatitude");
                const lon = EXIF.getTag(this, "GPSLongitude");
                const latRef = EXIF.getTag(this, "GPSLatitudeRef");
                const lonRef = EXIF.getTag(this, "GPSLongitudeRef");

                if (lat && lon) {
                    const decimalLat = convertToDecimal(lat, latRef);
                    const decimalLon = convertToDecimal(lon, lonRef);

                    gpsBox.classList.remove('hidden');
                    statusCard.classList.add('danger-zone');
                    document.getElementById('resGPSStatus').innerText = "EXPOSED";
                    document.getElementById('resGPSStatus').classList.add('text-red-500');
                    document.getElementById('latVal').innerText = decimalLat.toFixed(6);
                    document.getElementById('lonVal').innerText = decimalLon.toFixed(6);
                    document.getElementById('mapLink').href = `https://www.google.com/maps?q=${decimalLat},${decimalLon}`;
                } else {
                    gpsBox.classList.add('hidden');
                    statusCard.classList.remove('danger-zone');
                    document.getElementById('resGPSStatus').innerText = "PROTECTED";
                    document.getElementById('resGPSStatus').classList.add('text-green-500');
                }
            });
        }

        function convertToDecimal(coords, ref) {
            // Camera data is stored as [degrees, minutes, seconds]
            let d = coords[0].numerator / coords[0].denominator;
            let m = coords[1].numerator / coords[1].denominator;
            let s = coords[2].numerator / coords[2].denominator;
            
            let decimal = d + (m / 60) + (s / 3600);
            if (ref === "S" || ref === "W") decimal = decimal * -1;
            return decimal;
        }
    </script>
</body>
</html>
